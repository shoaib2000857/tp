<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 444" width="980" height="444" role="img" aria-labelledby="title description">
  <title id="title">Online Course Reservation System use case diagram</title>
  <desc id="description">Student can browse courses, reserve a seat, view reservations and cancel a reservation. Administrator can manage course offerings and open or close reservations.</desc>
  <rect width="980" height="444" fill="white"/>
  <rect x="220" y="24" width="520" height="396" fill="#f5f8fc" stroke="#243348" stroke-width="2"/>
  <g fill="none" stroke="#243348" stroke-width="1.6">
    <path d="M105 207 L354 103 M105 207 L354 184 M105 207 L354 265 M105 207 L354 346 M870 207 L610 170 M870 207 L610 274"/>
    <circle cx="85" cy="184" r="10"/><path d="M85 194 V222 M65 207 H105 M85 222 L71 241 M85 222 L99 241"/>
    <circle cx="890" cy="184" r="10"/><path d="M890 194 V222 M870 207 H910 M890 222 L876 241 M890 222 L904 241"/>
    <g fill="white">
      <ellipse cx="354" cy="103" rx="104" ry="27"/><ellipse cx="354" cy="184" rx="104" ry="27"/>
      <ellipse cx="354" cy="265" rx="104" ry="27"/><ellipse cx="354" cy="346" rx="104" ry="27"/>
      <ellipse cx="610" cy="170" rx="104" ry="27"/><ellipse cx="610" cy="274" rx="104" ry="27"/>
    </g>
  </g>
  <g fill="#182335" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">
    <text x="480" y="52" font-size="17" font-weight="bold">Online Course Reservation System</text>
    <text x="85" y="260">Student</text><text x="890" y="260">Administrator</text>
    <text x="354" y="108">Browse Courses</text><text x="354" y="189">Reserve Seat</text>
    <text x="354" y="270">View My Reservations</text><text x="354" y="351">Cancel Reservation</text>
    <text x="610" y="175">Manage Course Offerings</text><text x="610" y="279">Open or Close Reservations</text>
  </g>
</svg>
