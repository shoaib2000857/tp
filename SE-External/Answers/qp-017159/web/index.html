<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Course Reservation Lab</title>
  <style>
    body { max-width: 42rem; margin: 3rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; color: #183047; background: #f4f8fb; }
    table { width: 100%; border-collapse: collapse; background: white; }
    caption, th, td { padding: .65rem; text-align: left; }
    th, td { border-bottom: 1px solid #b8c7d4; }
  </style>
</head>
<body>
  <main>
    <h1>Online Course Reservation</h1>
    <p>Sample course listings served by Nginx on AWS EC2.</p>
    <table>
      <caption>Example course offerings</caption>
      <thead><tr><th scope="col">Course</th><th scope="col">Class time</th></tr></thead>
      <tbody>
        <tr><td>Software Engineering</td><td>Monday, 10:00</td></tr>
        <tr><td>Database Systems</td><td>Wednesday, 11:00</td></tr>
      </tbody>
    </table>
  </main>
</body>
</html>
