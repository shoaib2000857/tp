# Run FROM REPO ROOT: docker compose -f compose/wordpress.yml up -d
# Browser http://localhost:8080 ; preserve DB: down (NOT down -v)
services:
  wordpress:
    image: wordpress:latest
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: examonly
      WORDPRESS_DB_NAME: wordpress
    depends_on:
      db:
        condition: service_healthy
    networks: [app-net]
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: examroot
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: examonly
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/mysql
    networks: [app-net]
networks:
  app-net:
volumes:
  db-data:
