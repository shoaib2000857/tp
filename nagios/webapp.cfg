# Example only. Nagios Core needs template definitions generic-host/generic-service,
# check-host-alive and check_http commands, plus cfg_file registration in nagios.cfg.
# If Nagios shares a Docker network with Nginx service "web", its hostname is web, port 80.
define host {
    use                 generic-host
    host_name           web
    alias               Nginx Web Container
    address             web
    check_command       check-host-alive
    max_check_attempts  3
    check_interval      1
    retry_interval      1
}
define service {
    use                 generic-service
    host_name           web
    service_description HTTP Availability
    check_command       check_http
    max_check_attempts  3
    check_interval      1
    retry_interval      1
}
