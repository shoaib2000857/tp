# Example Nagios Core host+HTTP checks. Requires generic-host/generic-service templates and check_http/check-host-alive command definitions.
# Copy into Nagios objects dir; register cfg_file path in nagios.cfg, validate and reload.
# Nagios must be on same Docker network as web; change address if appropriate.
define host {
  use generic-host
  host_name web
  alias Vehicle Rental Portal
  address web
  check_command check-host-alive
  max_check_attempts 3
  check_interval 1
  retry_interval 1
}
define service {
  use generic-service
  host_name web
  service_description HTTP Availability
  check_command check_http
  max_check_attempts 3
  check_interval 1
  retry_interval 1
}
# CPU/RAM/disk/uptime need an agent or remote plugin; DB service checks need check_tcp/DB plugin.
