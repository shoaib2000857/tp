# Replace YOUR_DOCKERHUB_USERNAME before apply.
apiVersion: apps/v1
kind: Deployment
metadata: {name: set6-web}
spec:
  replicas: 2
  selector: {matchLabels: {app: set6-web}}
  template:
    metadata: {labels: {app: set6-web}}
    spec:
      containers:
        - name: web
          image: YOUR_DOCKERHUB_USERNAME/set6:v1
          ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: set6-web}
spec:
  type: NodePort
  selector: {app: set6-web}
  ports: [{port: 8080, targetPort: 8080}]
