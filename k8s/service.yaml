# kubectl apply -f k8s/service.yaml; kubectl get svc
# Service selector must match Pods app: myapp; NodePort 30080 must be available.
apiVersion: v1
kind: Service
metadata:
  name: myapp
spec:
  type: NodePort
  selector:
    app: myapp
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
