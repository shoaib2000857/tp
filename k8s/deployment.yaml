# kubectl apply -f k8s/deployment.yaml (replace image!)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 4
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: YOUR_DOCKERHUB_USERNAME/myapp:latest
          ports:
            - containerPort: 8080
